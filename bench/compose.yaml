# Memory benchmark for cms/ (item 4).
#   MEMSWAP=350m  → no swap (memswap_limit == mem_limit)
#   MEMSWAP=862m  → 512 MB of swap on top of 350 MB (needs swap enabled on the host)
# Values below are local test values only.
services:
  cms:
    build:
      context: .
      args:
        VARIANT: ${VARIANT:-standard}
    image: sandbox-cms-bench:${VARIANT:-standard}
    mem_limit: 350m
    memswap_limit: ${MEMSWAP:-350m}
    ports:
      - "${PORT:-4321}:4321"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EMDASH_SITE_URL: http://localhost:${PORT:-4321}
      EMDASH_ENCRYPTION_KEY: ${EMDASH_ENCRYPTION_KEY:?set a local test key}
      EMDASH_SETUP_TOKEN: local-setup-token-0123456789
      EMDASH_ALLOW_INVITES: "on"
      EMAIL_OUTBOX_DIR: /data/outbox
      DISCORD_CLIENT_ID: mock-client-id
      DISCORD_CLIENT_SECRET: mock-client-secret
      DISCORD_GUILD_ID: "100000000000000001"
      DISCORD_LEADER_ROLE_IDS: "300000000000000002"
      DISCORD_MEMBER_ROLE_IDS: "300000000000000001"
      DISCORD_BOT_TOKEN: mock-bot-token
      DISCORD_API_BASE: http://host.docker.internal:${MOCK_PORT:-4400}/api/v10
      DISCORD_AUTHORIZE_URL: http://127.0.0.1:${MOCK_PORT:-4400}/oauth2/authorize
      NODE_OPTIONS: ${NODE_OPTIONS:-}
    volumes:
      - data:/data
      # mail written by the outbox plugin (invite links for the benchmark)
      - ${OUTBOX_DIR:-./.build/outbox}:/data/outbox
volumes:
  data:
